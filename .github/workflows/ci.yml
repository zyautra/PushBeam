name: CI

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "shared/**"
      - "server/**"
      - "admin-cli/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "android/**"
      - "shared/**"
      - "server/**"
      - "admin-cli/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      # 실제 Firebase 설정이 없으면 예시 파일로 컴파일만 확인한다.
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > android/google-services.json
          else cp android/google-services.example.json android/google-services.json; fi

      - name: Test and build
        run: ./gradlew :shared:test :server:test :admin-cli:test :android:assembleDebug
