name: Android → App Distribution

# 필요한 저장소 설정 (Settings → Secrets and variables → Actions)
#   Variables: FIREBASE_APP_ID, PUSHBEAM_URL, FIREBASE_TESTER_GROUP(선택, 기본 pushbeam-members)
#   Secrets:   GOOGLE_SERVICES_JSON, FIREBASE_SERVICE_ACCOUNT,
#              ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  push:
    tags: ["pushbeam-v*"]   # 예: git tag pushbeam-v0.2.0 && git push origin pushbeam-v0.2.0
  workflow_dispatch:

jobs:
  distribute:
    runs-on: ubuntu-latest
    env:
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      PUSHBEAM_URL: ${{ vars.PUSHBEAM_URL }}
      TESTER_GROUP: ${{ vars.FIREBASE_TESTER_GROUP || 'pushbeam-members' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Check configuration
        run: |
          for v in FIREBASE_APP_ID PUSHBEAM_URL; do
            [ -n "${!v}" ] || { echo "::error::repository variable $v is not set"; exit 1; }
          done

      - name: Firebase config and keystore
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > android/google-services.json
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # versionCode는 실행 번호 + 100 (수동 배포 번호와 겹치지 않게)
          export VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))
          if [[ "$GITHUB_REF" == refs/tags/pushbeam-v* ]]; then export VERSION_NAME="${GITHUB_REF_NAME#pushbeam-v}"
          else export VERSION_NAME="dev-$GITHUB_RUN_NUMBER"; fi
          ./gradlew :android:assembleRelease

      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools appdistribution:distribute \
            android/build/outputs/apk/release/android-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "$TESTER_GROUP" \
            --release-notes "$(git log -1 --pretty=%s)"
