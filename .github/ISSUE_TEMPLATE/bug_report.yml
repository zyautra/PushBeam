name: 버그 신고
description: 기대와 다르게 동작하는 것을 알려 주세요.
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: 구성요소
      options: [Server, Android, pushbeam-admin, 배포, 문서]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 버전
      placeholder: "0.1.0"
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요?
      description: 기대한 동작과 실제 동작을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
  - type: textarea
    id: logs
    attributes:
      label: 로그나 진단 정보
      description: 토큰, 키, 이메일은 지우고 붙여 주세요.
      render: text
