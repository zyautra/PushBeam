name: Bug report
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Server, Android, pushbeam-admin, Deployment, Docs]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.0"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs or diagnostics
      description: Remove tokens, keys and email addresses before pasting.
      render: text
